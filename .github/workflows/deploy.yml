name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual deployments

# Two deploys never interleave, so one run's `artisan up` cannot fire in the middle of another's.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Only deploy if tests pass. test.yml also checks that the committed public/build assets match the source.
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Check deploy secrets
        env:
          DEPLOY_SERVER: ${{ secrets.DEPLOY_SERVER }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=""
          for name in DEPLOY_SERVER DEPLOY_USER DEPLOY_KEY DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing deploy secrets:$missing"
            exit 1
          fi

      # The server runs no Node, so public/build is committed and arrives with the git merge below.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_MAINTENANCE_SECRET: ${{ secrets.DEPLOY_MAINTENANCE_SECRET }}
          DEPLOY_PHP_BIN: ${{ vars.DEPLOY_PHP_BIN }}
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ vars.DEPLOY_PORT || '22' }}
          envs: DEPLOY_PATH,DEPLOY_SHA,DEPLOY_MAINTENANCE_SECRET,DEPLOY_PHP_BIN
          command_timeout: 10m
          script: |
            set -Eeuo pipefail
            [ -n "${BASH_VERSION:-}" ] || { echo "Deploy script needs bash"; exit 1; }
            PHP_BIN="${DEPLOY_PHP_BIN:-php}"
            cd "$DEPLOY_PATH"

            # --- Preflight: nothing has changed yet ---------------------------------------
            "$PHP_BIN" -r 'exit(version_compare(PHP_VERSION, "8.4.0", ">=") ? 0 : 1);' \
              || { echo "::error::Server CLI PHP is $("$PHP_BIN" -r 'echo PHP_VERSION;'), need 8.4+"; exit 1; }

            # Read the .env-derived config while bypassing any cached config, using the code currently
            # on the server. The fake cache path sits inside the app, never in a shared directory.
            APP_CONFIG_CACHE="$DEPLOY_PATH/bootstrap/cache/deploy-nocache-$$.php" "$PHP_BIN" artisan about --only=environment --json \
              | "$PHP_BIN" -r '$e = json_decode(stream_get_contents(STDIN), true)["environment"] ?? [];
                               exit((($e["environment"] ?? "") === "production" && ! empty($e["debug_mode"])) ? 1 : 0);' \
              || { echo "::error::APP_DEBUG is true with APP_ENV=production; fix .env before deploying"; exit 1; }

            PREVIOUS_SHA="$(git rev-parse HEAD)"
            echo "Previous release: $PREVIOUS_SHA  ->  deploying $DEPLOY_SHA"

            # --- Maintenance window: the trap brings the site back up on any failure ------
            DOWN_RAN=0
            bring_up() { if [ "$DOWN_RAN" = 1 ]; then "$PHP_BIN" artisan up || true; fi; }
            trap bring_up EXIT
            if [ -n "${DEPLOY_MAINTENANCE_SECRET:-}" ]; then
              "$PHP_BIN" artisan down --retry=60 --secret="$DEPLOY_MAINTENANCE_SECRET"
            else
              "$PHP_BIN" artisan down --retry=60
            fi
            DOWN_RAN=1

            # --- Code: exactly the commit CI tested; refuses divergent history ------------
            git fetch origin main
            git merge --ff-only "$DEPLOY_SHA"

            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            "$PHP_BIN" artisan migrate --force

            # Caches: config, events, routes, views, plus filament:optimize and icons:cache
            "$PHP_BIN" artisan optimize

            "$PHP_BIN" artisan queue:restart

            "$PHP_BIN" artisan up
            DOWN_RAN=0
            echo "Deployed $DEPLOY_SHA (rollback target: $PREVIOUS_SHA)"

      - name: Notify on success
        if: success()
        run: echo "Deployment successful on commit ${{ github.sha }}"

      - name: Notify on failure
        if: failure()
        run: echo "Deployment failed on commit ${{ github.sha }}"
